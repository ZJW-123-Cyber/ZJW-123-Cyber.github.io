    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        
        /* ⭐️ 统一深蓝色雨夜背景 */

            display: flex;

            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%) !important;

        /* ⭐️ 恢复超宽间距，给彩虹留出通道 */

        /* 图片区域 */

    <script>
        // ==========================================
        // 1. 绘制插画 (纯 JS 生成，保持不变)
        // ==========================================
        const illCanvas = document.getElementById('illustrationCanvas');
        const ctx = illCanvas.getContext('2d');
        
        const W = 600;
        const H = 450;
        const dpr = window.devicePixelRatio || 1;
        illCanvas.width = W * dpr;
        illCanvas.height = H * dpr;
        ctx.scale(dpr, dpr);

        const LINE_COLOR = '#374151'; 
        const LINE_WIDTH = 3;
        const CLOUD_SHADOW = '#e2e8f0'; 

        function drawCloud(x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);
            ctx.lineWidth = LINE_WIDTH;
            ctx.strokeStyle = LINE_COLOR;
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.moveTo(-45, 15);
            ctx.bezierCurveTo(-60, 15, -60, -5, -40, -5); 
            ctx.bezierCurveTo(-40, -25, -10, -35, 10, -15); 
            ctx.bezierCurveTo(30, -30, 55, -10, 50, 10); 
            ctx.bezierCurveTo(65, 15, 55, 25, 40, 25); 
            ctx.lineTo(-45, 25); 
            ctx.closePath();
            ctx.fillStyle = CLOUD_SHADOW;
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-45, 15);
            ctx.bezierCurveTo(-60, 15, -60, -5, -40, -5);
            ctx.bezierCurveTo(-40, -25, -10, -35, 10, -15);
            ctx.bezierCurveTo(30, -30, 55, -10, 50, 10);
            ctx.bezierCurveTo(65, 15, 55, 25, 40, 25);
            ctx.lineTo(-45, 25);
            ctx.closePath();
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        function drawRainbow(cx, cy) {
            const colors = ['#ff6b6b', '#feca57', '#1dd1a1', '#54a0ff'];
            const startR = 180;
            const gap = 22;
            colors.forEach((_, i) => {
                ctx.beginPath(); ctx.arc(cx, cy, startR - i * gap, Math.PI, 0);
                ctx.lineWidth = 24; ctx.strokeStyle = LINE_COLOR; ctx.lineCap = 'butt'; ctx.stroke();
            });
            colors.forEach((color, i) => {
                ctx.beginPath(); ctx.arc(cx, cy, startR - i * gap, Math.PI, 0);
                ctx.lineWidth = 18; ctx.strokeStyle = color; ctx.stroke();
            });
        }

        function drawRaindrop(x, y, size) {
            ctx.beginPath(); ctx.moveTo(x, y - size);
            ctx.bezierCurveTo(x + size * 1.2, y + size * 0.5, x + size * 0.5, y + size, x, y + size);
            ctx.bezierCurveTo(x - size * 0.5, y + size, x - size * 1.2, y + size * 0.5, x, y - size);
            ctx.closePath();
            ctx.fillStyle = '#74b9ff'; ctx.fill();
            ctx.lineWidth = 2.5; ctx.strokeStyle = LINE_COLOR; ctx.stroke();
        }

        function drawStar(x, y, size) {
            ctx.beginPath(); ctx.moveTo(x - size, y); ctx.lineTo(x + size, y);
            ctx.moveTo(x, y - size); ctx.lineTo(x, y + size);
            ctx.lineWidth = LINE_WIDTH; ctx.strokeStyle = LINE_COLOR; ctx.lineCap = 'round'; ctx.stroke();
        }

        function drawIllustration() {
            ctx.clearRect(0, 0, W, H);
            const cx = W / 2; 
            const cy = H - 80; 

            drawStar(140, 100, 8); drawStar(480, 90, 8);
            drawStar(220, 50, 5); drawStar(400, 130, 6);
            drawStar(360, 60, 5); drawStar(150, 220, 6);
            drawStar(480, 220, 5);

            drawRainbow(cx, cy);

            drawRaindrop(cx - 30, cy - 40, 8);
            drawRaindrop(cx + 30, cy - 60, 9);
            drawRaindrop(cx, cy - 15, 6);
            drawRaindrop(cx + 60, cy - 25, 7);
            drawRaindrop(cx - 70, cy - 20, 6);

            drawCloud(cx - 170, cy + 15, 1.1); 
            drawCloud(cx + 170, cy + 15, 1.1); 
            drawCloud(140, 140, 0.9); 
            drawCloud(480, 120, 0.85); 

            ctx.beginPath(); ctx.moveTo(60, cy + 35); ctx.lineTo(540, cy + 35);
            ctx.lineWidth = 2; ctx.strokeStyle = LINE_COLOR; ctx.setLineDash([12, 8]); ctx.stroke();
            
            ctx.beginPath(); ctx.setLineDash([]); ctx.lineWidth = 3; ctx.strokeStyle = '#74b9ff';
            const waves = [
                [100, cy+50, 20], [150, cy+45, 15], [200, cy+55, 25], 
                [280, cy+48, 18], [350, cy+52, 22], [420, cy+45, 15], [480, cy+50, 20]
            ];
            waves.forEach(w => { ctx.moveTo(w[0], w[1]); ctx.lineTo(w[0] + w[2], w[1]); });
            ctx.stroke();
        }
        drawIllustration();

        // ==========================================
        // 2. 常规雨滴特效
        // ==========================================
        const canvas = document.getElementById('rainCanvas');
        const rCtx = canvas.getContext('2d');
        let rW, rH;
        function resizeCanvas() {
            rW = canvas.width = window.innerWidth;
            rH = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        class Raindrop {
            constructor() { this.reset(); this.y = Math.random() * rH; }
            reset() {
                this.x = Math.random() * rW; this.y = Math.random() * -rH; 
                this.length = Math.random() * 15 + 10; this.speed = Math.random() * 8 + 8; 
                this.opacity = Math.random() * 0.3 + 0.2; this.width = Math.random() * 1.2 + 0.5; 
            }
            update() {
                this.y += this.speed;
                if (this.y > rH) { ripples.push(new Ripple(this.x, rH - 10)); this.reset(); }
            }
            draw() {
                rCtx.beginPath(); rCtx.moveTo(this.x, this.y);
                rCtx.lineTo(this.x - this.length * 0.1, this.y + this.length); 
                rCtx.strokeStyle = `rgba(200, 240, 255, ${this.opacity})`; rCtx.lineWidth = this.width; rCtx.stroke();
            }
        }

        class Ripple {
            constructor(x, y) {
                this.x = x; this.y = y + Math.random() * 10 - 5; 
                this.radius = 1; this.opacity = 0.8; this.speed = Math.random() * 0.8 + 0.4;
            }
            update() { this.radius += this.speed; this.opacity -= 0.015; }
            draw() {
                if (this.opacity <= 0) return;
                rCtx.beginPath(); rCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                rCtx.strokeStyle = `rgba(180, 220, 255, ${this.opacity})`; rCtx.lineWidth = 1; rCtx.stroke();
            }
        }

        const raindrops = []; const ripples = [];
        for (let i = 0; i < 150; i++) { raindrops.push(new Raindrop()); }

        function animateRain() {
            rCtx.clearRect(0, 0, rW, rH);
            raindrops.forEach(drop => { drop.update(); drop.draw(); });
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update(); ripples[i].draw();
                if (ripples[i].opacity <= 0) ripples.splice(i, 1); 
            }
            requestAnimationFrame(animateRain);
        }
        animateRain();
    </script>
